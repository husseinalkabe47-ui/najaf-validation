name: Validate database schema

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        schema: [working-18-14, delivered-11.2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: pw
      PERF_SOFT: "1"
      KEEP_DB: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # يقبل أي اسم ZIP يبدأ بـ najaf-phase11-3-validation (مثل -2 أو -2-1 أو "-2 (1)") ويختار الأحدث رفعًا،
      # ويبحث عن run_validation.sh داخله أيًّا كان عمق المجلد، ثم يطبّع المسار إلى phase11-3/ دائمًا.
      - name: Find and unpack the package
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( najaf-phase11-3-validation*.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No najaf-phase11-3-validation*.zip found in the repository root"
            ls -la
            exit 1
          fi
          best=""; bestt=-1
          for z in "${zips[@]}"; do
            t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true); t=${t:-0}
            echo "found: $z (last commit time: $t)"
            if [ "$t" -gt "$bestt" ] || { [ "$t" -eq "$bestt" ] && [ "$z" = "najaf-phase11-3-validation-2.zip" ]; }; then
              best="$z"; bestt="$t"
            fi
          done
          echo "using: $best"
          rm -rf _pkg phase11-3
          mkdir _pkg
          unzip -q "$best" -d _pkg
          script=$(find _pkg -maxdepth 4 -name run_validation.sh | head -n 1)
          if [ -z "$script" ]; then
            echo "::error::run_validation.sh not found inside $best"
            find _pkg | head -50
            exit 1
          fi
          dir=$(dirname "$script")
          mv "$dir" phase11-3
          chmod +x phase11-3/run_validation.sh phase11-3/concurrency/run_concurrency.sh
          echo "package ready at phase11-3/ (zip: $best, original folder: $dir)"
          ls phase11-3

      - name: Run validation
        id: run
        working-directory: phase11-3
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          export SCHEMA_FILE="$PWD/najaf_schema_v1.${{ matrix.schema }}.sql"
          set +e
          ./run_validation.sh
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Show the summary on the run page
        if: always()
        working-directory: phase11-3
        run: |
          echo "## Schema: ${{ matrix.schema }} (script exit code: ${{ steps.run.outputs.rc }})" >> "$GITHUB_STEP_SUMMARY"
          for f in results/*/summary.md; do
            [ -f "$f" ] && head -c 900000 "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "---- console ----"
          cat results/*/console.log 2>/dev/null || true

      - name: Keep all result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.schema }}
          path: phase11-3/results
          retention-days: 30
