name: Evaluate node-pg-migrate (isolated test, does not touch the project)

# ط§ط®طھط¨ط§ط± ظ‚ط±ط§ط± ظپظ‚ط·: ظٹط´ط؛ظ‘ظ„ node-pg-migrate (ظ†ط³ط®ط© ظ…ط³طھظ‚ط±ط© ظپظ‚ط·) ط¹ظ„ظ‰ PostgreSQL 16 ط­ظ‚ظٹظ‚ظٹ ظپظٹ ظ…ط¬ظ„ط¯ ظ…ط¤ظ‚طھ (RUNNER_TEMP).
# ظ„ط§ ظٹظƒطھط¨ ظپظٹ ظ…ظ„ظپط§طھ ط§ظ„ظ…ط´ط±ظˆط¹ ظˆظ„ط§ ظٹط«ط¨ظ‘طھ ط´ظٹط¦ظ‹ط§ ظپظٹظ‡طŒ ظˆظٹظ‚ط±ط£ database/migrations ظ…ظ† ظ†ط³ط®ط© ظ‚ط±ط§ط،ط© ظپظ‚ط·.
# طھط´ط؛ظٹظ„ ظٹط¯ظˆظٹ: Actions â†گ "Evaluate node-pg-migrate" â†گ Run workflow. ط§ظ„ظ†طھظٹط¬ط© ظپظٹ طµظپط­ط© Summary.
on:
  workflow_dispatch:
    inputs:
      tool_version:
        description: "node-pg-migrate version (leave empty = npm latest tag; prerelease versions are rejected)"
        required: false
        default: ""

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "0. Locate the migrations (read-only copy) and fingerprint them"
        run: |
          set -uo pipefail
          EVAL="$RUNNER_TEMP/eval"; mkdir -p "$EVAL/dumps" "$EVAL/gen"
          echo "EVAL=$EVAL" >> "$GITHUB_ENV"
          : > "$EVAL/results.txt"
          if [ -d database/migrations ] && [ -f database/validation/run_validation.sh ]; then
            PROJ="$GITHUB_WORKSPACE"
          else
            shopt -s nullglob
            zips=( najaf-showrooms-app*.zip )
            if [ ${#zips[@]} -eq 0 ]; then echo "::error::project files not found and no najaf-showrooms-app*.zip in the repository root"; exit 1; fi
            best=""; bestt=-1
            for z in "${zips[@]}"; do
              t=$(git log -1 --format=%ct -- "$z" 2>/dev/null || true); t=${t:-0}
              if [ "$t" -gt "$bestt" ]; then best="$z"; bestt="$t"; fi
            done
            echo "using zip: $best"
            mkdir -p "$EVAL/proj" && unzip -q "$best" -d "$EVAL/proj"
            marker=$(find "$EVAL/proj" -maxdepth 4 -type d -path '*/database/migrations' | head -n 1)
            if [ -z "$marker" ]; then echo "::error::database/migrations not found inside $best"; exit 1; fi
            PROJ=$(dirname "$(dirname "$marker")")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "project root: $PROJ"
          mkdir -p "$EVAL/mig_ro"
          cp "$PROJ"/database/migrations/*.sql "$EVAL/mig_ro/"
          ( cd "$PROJ/database/migrations" && sha256sum *.sql ) > "$EVAL/manifest_before.txt"
          chmod a-w "$EVAL"/mig_ro/*.sql "$EVAL/mig_ro"
          cat > "$EVAL/lib.sh" <<'LIB'
          rec() { local l="${1//|//}" d="${3//|//}"; d="$(printf '%s' "$d" | tr '\n' ' ' | cut -c1-380)"; printf '%s|%s|%s\n' "$l" "$2" "$d" >> "$EVAL/results.txt"; echo "[$2] $l :: $d"; }
          q() { psql -X -q -At -d "$1" -c "$2"; }
          # normalized schema-only dump (tracking schema "ops" excluded; random \restrict tokens and comments removed)
          dumpdb() { pg_dump -s --no-owner --exclude-schema=ops -d "$1" 2>/dev/null | grep -v -E '^--' | grep -v -E '^\\(un)?restrict' | sed -E 's/[[:space:]]+$//' | cat -s > "$2"; }
          # tool DB DIR DIRECTION [COUNT] [DBUSER] [DBPASS] [SINGLE]
          tool() { DB="$1" MIGDIR="$2" DIRECTION="$3" COUNT="${4:-}" DBUSER="${5:-postgres}" DBPASS="${6:-pw}" SINGLE="${7:-false}" node "$EVAL/tool/run.mjs"; }
          cmpdump() { # id expected actual
            if diff -q "$2" "$3" >/dev/null 2>&1; then rec "$1" PASS "dump identical to the psql reference"; else
              diff -u "$2" "$3" | head -40
              rec "$1" FAIL "dump differs from the psql reference: $(diff "$2" "$3" | grep -c '^[<>]') changed lines; first: $(diff "$2" "$3" | grep -m3 '^[<>]' | tr '\n' ' ')"; fi
          }
          LIB
          N=$(ls "$EVAL"/mig_ro/*.sql | wc -l)
          source "$EVAL/lib.sh"
          if [ "$N" = "13" ]; then rec "S0 migrations found" PASS "13 files: $(ls "$EVAL"/mig_ro | head -1) ... $(ls "$EVAL"/mig_ro | tail -1)"; else rec "S0 migrations found" FAIL "found $N files, expected 13"; fi
          rec "S0 server" INFO "$(q postgres 'select version()' | cut -c1-60) | psql $(psql --version | cut -d' ' -f3) | node $(node -v)"

      - name: "1. Install node-pg-migrate (stable only) in an isolated temp directory"
        env:
          TOOL_VERSION_INPUT: ${{ inputs.tool_version }}
        run: |
          set -uo pipefail
          source "$EVAL/lib.sh"
          mkdir -p "$EVAL/tool" && cd "$EVAL/tool"
          npm init -y >/dev/null 2>&1
          echo "== dist-tags:"; npm view node-pg-migrate dist-tags --json 2>&1 | head -20
          if [ -n "$TOOL_VERSION_INPUT" ]; then VER="$TOOL_VERSION_INPUT"; else VER=$(npm view node-pg-migrate dist-tags.latest 2>&1 | tail -1); fi
          echo "requested version: $VER"
          case "$VER" in
            *-*|"") rec "S1 install" FAIL "refusing a prerelease/empty version: '$VER'"; exit 0;;
          esac
          if ! npm install "node-pg-migrate@$VER" pg@8 --no-audit --no-fund --save-exact 2>&1 | tail -5; then :; fi
          INSTALLED=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/node-pg-migrate/package.json','utf8')).version" 2>/dev/null || echo "?")
          PGV=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/pg/package.json','utf8')).version" 2>/dev/null || echo "?")
          cat > "$EVAL/tool/run.mjs" <<'NODE'
          import { createRequire } from 'node:module';
          let mod;
          try { mod = await import('node-pg-migrate'); } catch { mod = createRequire(import.meta.url)('node-pg-migrate'); }
          const runner = mod.runner ?? mod.default?.runner;
          const env = process.env;
          if (typeof runner !== 'function') { console.log(JSON.stringify({ ok: false, error: 'runner() is not exported by this version' })); process.exit(1); }
          const url = `postgres://${env.DBUSER}:${env.DBPASS}@localhost:5432/${env.DB}`;
          const opts = {
            databaseUrl: url,
            dir: env.MIGDIR,
            direction: env.DIRECTION || 'up',
            migrationsTable: 'pgmigrations',
            migrationsSchema: 'ops',
            createMigrationsSchema: true,
            singleTransaction: env.SINGLE === 'true',
            log: () => {},
          };
          if (env.COUNT) opts.count = Number(env.COUNT);
          try {
            const r = await runner(opts);
            console.log(JSON.stringify({ ok: true, ran: (r || []).map((m) => m.name ?? m.id ?? String(m)) }));
          } catch (e) {
            console.log(JSON.stringify({ ok: false, error: String((e && e.message) || e).replace(/\s+/g, ' ').slice(0, 500) }));
            process.exitCode = 1;
          }
          NODE
          cat > "$EVAL/gen_down.py" <<'PY'
          import os, re, sys
          MIG, OUT = sys.argv[1], sys.argv[2]
          os.makedirs(OUT + '/down', exist_ok=True); os.makedirs(OUT + '/wrap', exist_ok=True)

          def statements(t):
              out, buf, i, n, sq = [], [], 0, len(t), False
              while i < n:
                  c = t[i]
                  if not sq and t.startswith('--', i):
                      j = t.find('\n', i); i = n if j < 0 else j; continue
                  if not sq and t.startswith('$$', i):
                      j = t.find('$$', i + 2); buf.append(t[i:j + 2]); i = j + 2; continue
                  if c == "'": sq = not sq
                  if c == ';' and not sq:
                      s = ''.join(buf).strip()
                      if s: out.append(s)
                      buf = []; i += 1; continue
                  buf.append(c); i += 1
              s = ''.join(buf).strip()
              if s: out.append(s)
              return out

          def arg_types(sig):
              depth, cur, parts = 0, '', []
              for ch in sig:
                  if ch in '([': depth += 1
                  if ch in ')]': depth -= 1
                  if ch == ',' and depth == 0: parts.append(cur.strip()); cur = ''; continue
                  cur += ch
              if cur.strip(): parts.append(cur.strip())
              types = []
              for p in parts:
                  p = re.split(r'\s+DEFAULT\s+', p, flags=re.I)[0].strip()
                  m = re.match(r'(?:(?:IN|OUT|INOUT|VARIADIC)\s+)?\w+\s+(.+)$', p, re.S)
                  types.append(m.group(1).strip() if m else p)
              return ', '.join(types)

          created = {'table': set(), 'function': set(), 'domain': set(), 'view': set(), 'trigger': set(), 'index': set(), 'extension': set()}
          dropped = {k: set() for k in created}
          unhandled = []

          def down_for(s):
              u = re.sub(r'\s+', ' ', s.strip())
              m = re.match(r'CREATE EXTENSION (?:IF NOT EXISTS )?(\w+)', u, re.I)
              if m: created['extension'].add(m.group(1)); dropped['extension'].add(m.group(1)); return 'DROP EXTENSION IF EXISTS %s;' % m.group(1)
              m = re.match(r'CREATE DOMAIN (\w+)', u, re.I)
              if m: created['domain'].add(m.group(1)); dropped['domain'].add(m.group(1)); return 'DROP DOMAIN IF EXISTS %s;' % m.group(1)
              m = re.match(r'CREATE (?:OR REPLACE )?FUNCTION (\w+) ?\(', u, re.I)
              if m:
                  name = m.group(1); start = u.index('(', m.start()) + 1; depth, k = 1, start
                  while depth and k < len(u):
                      depth += (u[k] == '(') - (u[k] == ')'); k += 1
                  created['function'].add(name); dropped['function'].add(name)
                  return 'DROP FUNCTION IF EXISTS %s(%s);' % (name, arg_types(u[start:k - 1]))
              m = re.match(r'CREATE TABLE (\w+)', u, re.I)
              if m: created['table'].add(m.group(1)); dropped['table'].add(m.group(1)); return 'DROP TABLE IF EXISTS %s;' % m.group(1)
              m = re.match(r'CREATE (?:UNIQUE )?INDEX (\w+)', u, re.I)
              if m: created['index'].add(m.group(1)); dropped['index'].add(m.group(1)); return 'DROP INDEX IF EXISTS %s;' % m.group(1)
              m = re.match(r'CREATE (?:CONSTRAINT )?TRIGGER (\w+) .*? ON (\w+)', u, re.I)
              if m: created['trigger'].add(m.group(1)); dropped['trigger'].add(m.group(1)); return 'DROP TRIGGER IF EXISTS %s ON %s;' % (m.group(1), m.group(2))
              m = re.match(r'CREATE VIEW (\w+)', u, re.I)
              if m: created['view'].add(m.group(1)); dropped['view'].add(m.group(1)); return 'DROP VIEW IF EXISTS %s;' % m.group(1)
              if re.match(r'DO\b', u, re.I): return '-- roles are cluster-level objects: intentionally NOT dropped by the rollback'
              m = re.match(r'INSERT INTO (\w+)', u, re.I)
              if m:
                  t = m.group(1)
                  if t == 'subscription_plans': return "DELETE FROM subscription_plans WHERE code = 'free';"
                  if t == 'app_settings':
                      keys = re.findall(r"^\s*\('([\w.]+)',", s, re.M)
                      if not keys: unhandled.append(u[:60]); return '-- UNHANDLED'
                      return 'DELETE FROM app_settings WHERE key IN (%s);' % ', '.join("'%s'" % k for k in keys)
              if re.match(r'GRANT\b', u, re.I):
                  d = 'REVOKE' + u[5:]; i = d.rfind(' TO ')
                  return d[:i] + ' FROM ' + d[i + 4:] + ';'
              if re.match(r'REVOKE\b', u, re.I):
                  d = 'GRANT' + u[6:]; i = d.rfind(' FROM ')
                  return d[:i] + ' TO ' + d[i + 6:] + ';'
              unhandled.append(u[:70]); return '-- UNHANDLED: ' + u[:70]

          files = sorted(f for f in os.listdir(MIG) if f.endswith('.sql'))
          for f in files:
              base = f[:-4]
              sts = statements(open(os.path.join(MIG, f), encoding='utf-8').read())
              downs = [down_for(s) for s in sts]
              open(os.path.join(OUT, 'down', base + '.down.sql'), 'w', encoding='utf-8').write('\n'.join(reversed(downs)) + '\n')
              open(os.path.join(OUT, 'wrap', base + '.js'), 'w', encoding='utf-8').write(
                  "const fs = require('node:fs');\nconst path = require('node:path');\n"
                  "exports.up = (pgm) => { pgm.sql(fs.readFileSync(path.join(process.env.EVAL_UP_DIR, '%s.sql'), 'utf8')); };\n"
                  "exports.down = (pgm) => { pgm.sql(fs.readFileSync(path.join(process.env.EVAL_DOWN_DIR, '%s.down.sql'), 'utf8')); };\n" % (base, base))
          missing = {k: sorted(created[k] - dropped[k]) for k in created if created[k] - dropped[k]}
          print('generated %d down scripts and %d wrappers' % (len(files), len(files)))
          print('created objects covered by a DROP:', {k: len(v) for k, v in created.items()})
          if unhandled or missing:
              print('UNHANDLED statements:', unhandled, '| objects without DROP:', missing); sys.exit(3)
          print('COVERAGE OK')
          PY
          if [ "$INSTALLED" = "?" ]; then rec "S1 install" FAIL "node-pg-migrate could not be installed (version requested: $VER)"; else
            case "$INSTALLED" in *-*) rec "S1 install" FAIL "installed a prerelease: $INSTALLED";; *) rec "S1 install" PASS "node-pg-migrate $INSTALLED (stable), pg $PGV";; esac
          fi
          exit 0

      - name: "2. CREATE ROLE / CREATE EXTENSION with non-superuser owners (roles must not exist yet)"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          psql -X -q -c "CREATE ROLE evalowner2 LOGIN PASSWORD 'pw'" 2>/dev/null
          psql -X -q -c "CREATE ROLE evalowner LOGIN PASSWORD 'pw' CREATEROLE" 2>/dev/null
          # R2: owner WITHOUT CREATEROLE, per-migration transactions
          createdb -O evalowner2 eval_owner2
          OUT=$(tool eval_owner2 "$EVAL/mig_ro" up "" evalowner2 pw false 2>&1); RC=$?; echo "$OUT" | tail -3
          APPLIED=$(q eval_owner2 "SELECT count(*) FROM ops.pgmigrations" 2>&1); TABLES=$(q eval_owner2 "SELECT count(*) FROM pg_tables WHERE schemaname='public'" 2>&1)
          EXT=$(q eval_owner2 "SELECT coalesce(string_agg(extname, ','), '-') FROM pg_extension WHERE extname IN ('citext','pg_trgm')" 2>&1)
          if [ $RC -ne 0 ]; then rec "R1 owner without CREATEROLE" PASS "fails as expected (CREATE ROLE needs CREATEROLE). applied=$APPLIED tables=$TABLES extensions-created-by-owner=$EXT | $OUT"; else rec "R1 owner without CREATEROLE" INFO "succeeded (unexpected): applied=$APPLIED"; fi
          # R3: same owner, one shared transaction: all-or-nothing
          createdb -O evalowner2 eval_owner3
          OUT=$(tool eval_owner3 "$EVAL/mig_ro" up "" evalowner2 pw true 2>&1); RC=$?
          TABLES=$(q eval_owner3 "SELECT count(*) FROM pg_tables WHERE schemaname='public'" 2>&1)
          if [ $RC -ne 0 ] && [ "$TABLES" = "0" ]; then rec "R2 single-transaction mode is all-or-nothing" PASS "failed and left 0 public tables"; else rec "R2 single-transaction mode is all-or-nothing" INFO "rc=$RC tables=$TABLES | $(echo "$OUT" | tail -1)"; fi
          # R4: owner WITH CREATEROLE
          createdb -O evalowner eval_owner
          OUT=$(tool eval_owner "$EVAL/mig_ro" up "" evalowner pw false 2>&1); RC=$?; echo "$OUT" | tail -3
          TABLES=$(q eval_owner "SELECT count(*) FROM pg_tables WHERE schemaname='public'" 2>&1)
          ROLES=$(q postgres "SELECT coalesce(string_agg(rolname, ','), '-') FROM pg_roles WHERE rolname IN ('najaf_app','najaf_report')" 2>&1)
          EXT=$(q eval_owner "SELECT coalesce(string_agg(extname, ','), '-') FROM pg_extension WHERE extname IN ('citext','pg_trgm')" 2>&1)
          if [ $RC -eq 0 ] && [ "$TABLES" = "16" ]; then rec "R3 owner with CREATEROLE (not superuser)" PASS "applied all 13: tables=$TABLES roles-created=$ROLES extensions=$EXT"; else rec "R3 owner with CREATEROLE (not superuser)" FAIL "rc=$RC tables=$TABLES | $OUT"; fi
          # cleanup so the main experiment starts with no najaf_* roles
          for d in eval_owner eval_owner2 eval_owner3; do psql -X -q -c "DROP DATABASE IF EXISTS $d WITH (FORCE)" 2>/dev/null; done
          psql -X -q -c "DROP ROLE IF EXISTS najaf_app, najaf_report, evalowner, evalowner2" 2>&1 | head -2
          exit 0

      - name: "3. Reference: apply 0001-0013 with psql -1 and dump after every step"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          createdb eval_ref; dumpdb eval_ref "$EVAL/dumps/ref_00.sql"
          i=0; FAILED=0
          for f in "$EVAL"/mig_ro/*.sql; do
            i=$((i+1))
            psql -X -q -v ON_ERROR_STOP=1 -1 -d eval_ref -f "$f" >/dev/null 2>"$EVAL/ref_err.txt" || { FAILED=1; rec "REF apply $i" FAIL "$(head -c 300 "$EVAL/ref_err.txt")"; break; }
            dumpdb eval_ref "$EVAL/dumps/ref_$(printf %02d $i).sql"
          done
          [ $FAILED -eq 0 ] && rec "REF psql -1 reference" PASS "13 migrations applied; 14 reference dumps saved"
          exit 0

      - name: "4. Tool: apply the 13 files AS-IS, then check tracking table location"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          createdb eval_tool
          OUT=$(tool eval_tool "$EVAL/mig_ro" up 2>&1); RC=$?; echo "$OUT" | tail -3
          if [ $RC -eq 0 ]; then rec "T1 apply 0001-0013 as-is (unmodified files)" PASS "$(echo "$OUT" | tail -1 | cut -c1-200)"; else rec "T1 apply 0001-0013 as-is (unmodified files)" FAIL "$OUT"; fi
          ROWS=$(q eval_tool "SELECT count(*) FROM ops.pgmigrations" 2>&1)
          dumpdb eval_tool "$EVAL/dumps/tool_asis.sql"
          cmpdump "T2 schema equals the psql -1 reference" "$EVAL/dumps/ref_13.sql" "$EVAL/dumps/tool_asis.sql"
          PUB=$(q eval_tool "SELECT count(*) FROM pg_tables WHERE schemaname='public'" 2>&1)
          LOC=$(q eval_tool "SELECT coalesce(string_agg(schemaname||'.'||tablename, ','), '-') FROM pg_tables WHERE tablename ILIKE '%migrat%'" 2>&1)
          if [ "$PUB" = "16" ] && [ "$LOC" = "ops.pgmigrations" ]; then rec "T3 tracking table outside public" PASS "public has $PUB tables; tracking table = $LOC; rows=$ROWS"; else rec "T3 tracking table outside public" FAIL "public tables=$PUB; tracking tables found: $LOC"; fi
          APP_OPS=$(q eval_tool "SELECT has_schema_privilege('najaf_app','ops','USAGE')" 2>&1)
          rec "T3b application role has no access to the tracking schema" INFO "najaf_app USAGE on ops = $APP_OPS (expected f)"
          exit 0

      - name: "5. Tool-applied database passes the 11.3 structure + seed suites"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          V="$PROJ/database/validation"
          python3 "$V/tools/gen_expected.py" "$V/najaf_schema_v1.working-18-14.sql" "$EVAL/05_expected.sql" >/dev/null 2>&1
          for f in "$V/sql/00_harness.sql" "$EVAL/05_expected.sql" "$V/sql/06_expected_public_ids.sql" "$V/sql/10_fixtures.sql"; do
            psql -X -q -v ON_ERROR_STOP=1 -d eval_tool -f "$f" >/dev/null 2>"$EVAL/s5_err.txt" || { rec "T4 11.3 harness load" FAIL "$(basename "$f"): $(head -c 250 "$EVAL/s5_err.txt")"; exit 0; }
          done
          psql -X -q -v ON_ERROR_STOP=0 -d eval_tool -f "$V/sql/20_structure.sql" >/dev/null 2>"$EVAL/s5_struct.txt"
          psql -X -q -v ON_ERROR_STOP=1 -d eval_tool -f "$PROJ/database/seed/najaf_demo_seed.sql" >/dev/null 2>"$EVAL/s5_seed.txt" || rec "T4 seed load" FAIL "$(head -c 250 "$EVAL/s5_seed.txt")"
          psql -X -q -v ON_ERROR_STOP=0 -d eval_tool -f "$V/sql/30_seed_checks.sql" >/dev/null 2>"$EVAL/s5_checks.txt"
          q eval_tool "SELECT suite||': '||count(*) FILTER (WHERE ok)||'/'||count(*) FROM vt.results GROUP BY suite ORDER BY min(id)"
          TOTAL=$(q eval_tool "SELECT count(*) FROM vt.results"); BAD=$(q eval_tool "SELECT count(*) FROM vt.results WHERE NOT ok")
          if [ "$BAD" = "0" ] && [ "${TOTAL:-0}" -ge 51 ]; then rec "T4 11.3 structure(21)+seed(30) suites on the tool-applied DB" PASS "$TOTAL/$TOTAL passed"; else rec "T4 11.3 structure(21)+seed(30) suites on the tool-applied DB" FAIL "total=$TOTAL failed=$BAD: $(q eval_tool "SELECT string_agg(name, ' ; ') FROM (SELECT name FROM vt.results WHERE NOT ok LIMIT 3) s" | cut -c1-250)"; fi
          exit 0

      - name: "6. Rollback on the as-is files (no down section exists)"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          BT=$(q eval_tool "SELECT count(*) FROM pg_tables WHERE schemaname='public'"); BM=$(q eval_tool "SELECT count(*) FROM ops.pgmigrations")
          OUT=$(tool eval_tool "$EVAL/mig_ro" down 1 2>&1); RC=$?; echo "$OUT" | tail -3
          AT=$(q eval_tool "SELECT count(*) FROM pg_tables WHERE schemaname='public'"); AM=$(q eval_tool "SELECT count(*) FROM ops.pgmigrations")
          if [ $RC -ne 0 ] && [ "$AT" = "$BT" ] && [ "$AM" = "$BM" ]; then rec "T5 down on the unmodified files" PASS "impossible as documented, and nothing changed (tables $BT->$AT, tracked $BM->$AM): $OUT"
          elif [ "$AT" = "$BT" ] && [ "$AM" != "$BM" ]; then rec "T5 down on the unmodified files" FAIL "DANGEROUS: tracking rows changed ($BM->$AM) but the schema did not (rc=$RC) | $OUT"
          else rec "T5 down on the unmodified files" INFO "rc=$RC tables $BT->$AT tracked $BM->$AM | $OUT"; fi
          exit 0

      - name: "7. Real rollback with temporary down scripts (generated outside the project)"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          python3 "$EVAL/gen_down.py" "$EVAL/mig_ro" "$EVAL/gen" 2>&1 | tee "$EVAL/gen/gen.log"; GRC=${PIPESTATUS[0]}
          if [ $GRC -ne 0 ]; then rec "T6 temporary down generator" FAIL "$(tail -2 "$EVAL/gen/gen.log")"; exit 0; fi
          rec "T6 temporary down generator" PASS "$(tail -1 "$EVAL/gen/gen.log"): every created object has a DROP; roles intentionally not dropped"
          echo "== a sample down (0013 and 0012):"; cat "$EVAL"/gen/down/0013*.down.sql; echo ---; cat "$EVAL"/gen/down/0012*.down.sql | head -20
          export EVAL_UP_DIR="$EVAL/mig_ro" EVAL_DOWN_DIR="$EVAL/gen/down"
          createdb eval_roll
          OUT=$(tool eval_roll "$EVAL/gen/wrap" up 2>&1); RC=$?; echo "$OUT" | tail -2
          if [ $RC -ne 0 ]; then rec "T7 apply through wrappers" FAIL "$OUT"; exit 0; fi
          dumpdb eval_roll "$EVAL/dumps/roll_up.sql"
          cmpdump "T7 wrappers (pgm.sql of the unmodified files) equal the reference" "$EVAL/dumps/ref_13.sql" "$EVAL/dumps/roll_up.sql"
          for n in 13 12 11 10 09 08 07 06 05 04 03 02 01; do
            p=$(printf %02d $((10#$n - 1)))
            OUT=$(tool eval_roll "$EVAL/gen/wrap" down 1 2>&1); RC=$?
            if [ $RC -ne 0 ]; then rec "T8 down step $n" FAIL "$OUT"; break; fi
            dumpdb eval_roll "$EVAL/dumps/roll_$n.sql"
            cmpdump "T8 after down $n the schema equals the reference after $p" "$EVAL/dumps/ref_$p.sql" "$EVAL/dumps/roll_$n.sql"
          done
          LEFT=$(q eval_roll "SELECT (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','v','S','m','p','f')) || ' relations, ' || (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid=p.oid AND d.deptype='e')) || ' own functions, ' || (SELECT count(*) FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='public' AND t.typtype='d') || ' domains, extensions=' || (SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension) || ', tracked=' || (SELECT count(*) FROM ops.pgmigrations)")
          case "$LEFT" in "0 relations, 0 own functions, 0 domains, extensions=plpgsql, tracked=0") rec "T9 full rollback leaves an empty database" PASS "$LEFT";; *) rec "T9 full rollback leaves an empty database" FAIL "$LEFT";; esac
          OUT=$(tool eval_roll "$EVAL/gen/wrap" up 2>&1); RC=$?
          dumpdb eval_roll "$EVAL/dumps/roll_reup.sql"
          if [ $RC -eq 0 ]; then cmpdump "T10 re-apply after the full rollback equals the reference" "$EVAL/dumps/ref_13.sql" "$EVAL/dumps/roll_reup.sql"; else rec "T10 re-apply after the full rollback" FAIL "$OUT"; fi
          exit 0

      - name: "8. Role drop evidence, project integrity, and the verdict table"
        if: always()
        run: |
          set +e
          source "$EVAL/lib.sh"
          DR=$(psql -X -q -c "DROP ROLE najaf_app" 2>&1 | head -3 | tr '\n' ' ')
          rec "R5 dropping the cluster-level role after the rollback" INFO "${DR:-succeeded}"
          ( cd "$PROJ/database/migrations" && sha256sum *.sql ) > "$EVAL/manifest_after.txt"
          if diff -q "$EVAL/manifest_before.txt" "$EVAL/manifest_after.txt" >/dev/null; then rec "I1 project migration files unchanged" PASS "$(wc -l < "$EVAL/manifest_after.txt") files, identical SHA-256 before and after"; else rec "I1 project migration files unchanged" FAIL "checksums changed"; fi
          if [ "$PROJ" = "$GITHUB_WORKSPACE" ]; then DIRTY=$(git status --porcelain | head -5 | tr '\n' ' '); [ -z "$DIRTY" ] && rec "I2 repository working tree clean" PASS "no file in the repository was modified" || rec "I2 repository working tree clean" FAIL "$DIRTY"; fi
          P=$(grep -c '|PASS|' "$EVAL/results.txt"); F=$(grep -c '|FAIL|' "$EVAL/results.txt"); I=$(grep -c '|INFO|' "$EVAL/results.txt")
          {
            echo "## node-pg-migrate evaluation"
            echo ""
            echo "**PASS $P آ· FAIL $F آ· INFO $I**"
            echo ""
            echo "| Test | Status | Evidence |"
            echo "| --- | --- | --- |"
            awk -F'|' '{ printf "| %s | %s | %s |\n", $1, $2, $3 }' "$EVAL/results.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "==== RESULTS ===="; cat "$EVAL/results.txt"
          exit 0

      - name: Keep the raw files (dumps, generated downs, results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrations-evaluation
          path: |
            ${{ env.EVAL }}/results.txt
            ${{ env.EVAL }}/dumps
            ${{ env.EVAL }}/gen
          if-no-files-found: ignore
          retention-days: 14
